[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.13,<4",
    "cmake>=3.26",
    "ninja",
]
build-backend = "scikit_build_core.build"

[project]
name = "cccgpu"
version = "0.2.4"
description = "The Clustermatch Correlation Coefficient (CCC) with GPU acceleration"
readme = "README.md"
requires-python = ">=3.10"
# SPDX license expression (PEP 639); matches the LICENSE file (BSD-2-Clause Plus
# Patent). Per PEP 639 the deprecated `License ::` trove classifier is omitted.
license = "BSD-2-Clause-Patent"
authors = [
    { name = "Milton Pividori", email = "milton.pividori@cuanschutz.edu" },
    { name = "Haoyu Zhang", email = "haoyu_z@outlook.com" },
]
dependencies = ["numpy", "scipy", "numba", "pandas", "scikit-learn", "pyyaml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
]

[project.urls]
Homepage = "https://github.com/pivlab/ccc-gpu"
Issues = "https://github.com/pivlab/ccc-gpu/issues"

[project.optional-dependencies]
# Plotting helpers used by `ccc.plots` (research/analysis only; not in the wheel).
plots = ["matplotlib", "seaborn", "upsetplot", "ipython"]
# Extra deps for the in-repo research/analysis modules (`ccc.methods`,
# `ccc.giant`); installable from a source checkout, kept out of the core install.
research = ["minepy", "requests"]
# Test-only dependencies.
test = ["pytest"]

[project.scripts]
ccc-gpu-bench = "ccc.bench.cli:main"

[tool.scikit-build]
# Configure scikit-build-core.
# Keep this CMake floor in sync with `cmake_minimum_required` in CMakeLists.txt.
cmake.version = ">=3.26"
cmake.args = [
    # Fat wheel: native SASS for Turing (7.5) -> Hopper (9.0); PTX from 9.0
    # forward-compats newer GPUs. The lowest arch (7.5) is the documented floor.
    "-DCMAKE_CUDA_ARCHITECTURES=75;80;86;89;90",
]
build.verbose = true
wheel.packages = ["libs/ccc"] # Directory containing your Python packages
# Exclude C++ headers and the research/analysis-only modules (they import
# undeclared heavy deps -- IPython/minepy/requests -- and are kept in-repo for
# `analysis/`, not the published wheel). `log.py`/`log_config.yaml` stay in the
# wheel because `ccc.utils.curl` and the test suite use them; `pyyaml` is a
# declared dependency so `ccc.log` imports cleanly.
wheel.exclude = [
    "*.cpp",
    "*.h",
    "ccc/plots.py",
    "ccc/methods.py",
    "ccc/giant.py",
    "ccc/corr.py",
]
# Note: wheel.py-api removed to support multiple Python versions (3.10-3.14)
wheel.platlib = true # Contains compiled extensions

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "gpu: test requires a CUDA GPU + the ccc_cuda_ext extension (auto-applied to tests/gpu; skipped when cupy/ccc_cuda_ext are unavailable)",
    "slow: test is slow (e.g. 1M-element inputs); excluded from the default CI subset",
    "network: test downloads data over the network; excluded from the default CI subset",
]

# --------------------------------------------------------------------------- #
# Ruff — single source of truth for Python lint + format.
#
# Scope: the installable package (`libs/ccc`) and the test suite (`tests`).
# `analysis/` and `docs/` are manuscript/notebook/tooling code intentionally
# left untouched and are excluded below. `force-exclude` makes the excludes
# apply even when pre-commit passes explicit file paths.
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py310"
line-length = 88
force-exclude = true
extend-exclude = [
    "analysis",
    "docs",
    "build",
    "_skbuild",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "I",   # isort
    "ARG", # flake8-unused-arguments
    "C4",  # flake8-comprehensions
    "EM",  # flake8-errmsg
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "NPY", # numpy-specific rules
    "PD",  # pandas-vet
]
# Intentionally NOT enabling isort's `required-imports` (no forced
# `from __future__ import annotations`) to avoid a semantic-adjacent mass edit.
ignore = [
    # --- Owned by the formatter / structural complexity (permanent) ---
    "E501",    # line length is handled by the formatter
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0913", # too many arguments — numeric kernels legitimately take many
    "PLR0915", # too many statements
    "PLR2004", # magic value comparison — pervasive in numeric code

    # --- Deferred to follow-up work (this change lands the tooling +
    #     mechanical format only; the fixes below are logic/behavior-adjacent
    #     and need manual review, so they are suppressed for now). ---
    "NPY002",  # legacy np.random.* — rewriting to Generator changes RNG streams/seeds
    "PLC0415", # import-outside-top-level — many are intentional lazy imports (cupy/torch/heavy deps)
    "EM101",   # raw-string-in-exception — mechanical message extraction
    "EM102",   # f-string-in-exception — mechanical message extraction
    "PT006",   # pytest parametrize names as tuple vs string
    "PT018",   # composite assertion in tests
    "PTH103",  # os.makedirs -> Path.mkdir
    "PTH118",  # os.path.join -> Path
    "PTH123",  # open() -> Path.open()
    "B905",    # zip() without strict= — adding strict= is behavior-changing
    "PLW1510", # subprocess.run without check= — adding check= is behavior-changing
    "PLW2901", # redefined loop variable
    "PLR1704", # redefined argument from local
    "RET504",  # unnecessary assignment before return
    "C403",    # unnecessary list comprehension (set)
    "C404",    # unnecessary list comprehension (dict)
    "C408",    # unnecessary dict/list/tuple call
    "C409",    # unnecessary literal within tuple call
    "C417",    # unnecessary map() usage
    "SIM105",  # suppressible exception -> contextlib.suppress
    "SIM113",  # use enumerate()
    "SIM117",  # combine nested with-statements
    "ARG002",  # unused method argument
    "UP028",   # yield-in-for-loop -> yield from
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004", # magic values are expected in test assertions
    "ARG",     # pytest fixtures are passed but not always referenced
    "B",       # bugbear patterns are acceptable in tests
    "PT011",   # broad pytest.raises without match is acceptable in tests
]

[tool.ruff.format]
docstring-code-format = true

[tool.cibuildwheel]
build = "cp3{10,11,12,13,14}-manylinux_x86_64"
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
# Install CUDA toolkit before building wheels[tool.cibuildwheel.linux]
before-all = [
    # Install yum-utils to get yum-config-manager
    "yum install -y yum-utils",
    # Add NVIDIA CUDA repository for RHEL 8 (manylinux_2_28 is based on AlmaLinux 8)
    "yum-config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo",
    # Clean yum cache
    "yum clean all",
    # Install GCC 13 toolset (provides GCC 13.2 under /opt/rh/gcc-toolset-13)
    "yum install -y gcc-toolset-13",
    # Install CUDA 12.8 toolkit (supports the GCC 13 toolset above; stays inside
    # the 12.x driver-compatibility window). Keep this comment and the package
    # version in sync.
    "yum install -y cuda-toolkit-12-8",
    # Print nvcc version with green prefix
    "echo -e '\\033[32m[cccgpu-info]:\\033[0m'",
    "nvcc --version",
    # Print gcc version with green prefix
    "echo -e '\\033[32m[cccgpu-info]:\\033[0m'",
    "/opt/rh/gcc-toolset-13/root/usr/bin/gcc --version",
]

# Set CUDA and GCC 13 environment variables (prefer gcc-toolset-13 in PATH)
environment = { CUDA_HOME = "/usr/local/cuda", CUDACXX = "/usr/local/cuda/bin/nvcc", CC = "/opt/rh/gcc-toolset-13/root/usr/bin/gcc", CXX = "/opt/rh/gcc-toolset-13/root/usr/bin/g++", CUDAHOSTCXX = "/opt/rh/gcc-toolset-13/root/usr/bin/g++", CMAKE_C_COMPILER = "/opt/rh/gcc-toolset-13/root/usr/bin/gcc", CMAKE_CXX_COMPILER = "/opt/rh/gcc-toolset-13/root/usr/bin/g++", PATH = "/opt/rh/gcc-toolset-13/root/usr/bin:/usr/local/cuda/bin:$PATH", LD_LIBRARY_PATH = "/usr/local/cuda/lib64:/opt/rh/gcc-toolset-13/root/usr/lib64:$LD_LIBRARY_PATH" }

# Set CUDA environment variables
# environment = { CUDA_HOME="/usr/local/cuda-12.6", PATH="/usr/local/cuda-12.6/bin:$PATH", LD_LIBRARY_PATH="/usr/local/cuda-12.6/lib64:$LD_LIBRARY_PATH" }

# Test the built wheels (optional, can be disabled)
# test-requires = ["pytest", "numpy", "scipy"]
# test-command = "pytest {project}/tests -v"
