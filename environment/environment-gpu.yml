# Source environment for the ccc-gpu development / lock environment, bundled
# with CUDA. This file is the single source of truth for `conda-lock.yml`
# (regenerate with the command in environment/README.md). Pins reflect the
# tested modern stack: Python 3.12, NumPy 2.x, numba >=0.61, CUDA 12.x.
name: ccc-gpu
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.12.*
  # --- build toolchain ---
  - cmake>=3.26
  - ninja
  - pybind11=3.*
  - scikit-build-core>=0.10
  - pre-commit=4.*
  # --- CUDA toolkit + GPU runtime ---
  # See how CuPy pins CUDA so ccc-gpu can also ship as a pip wheel.
  - cuda=12.*
  - cupy=13.*
  # --- core runtime deps ---
  - numpy=2.*
  - numba>=0.61
  - pandas>=2.2
  - scipy>=1.13
  - scikit-learn>=1.5
  - pyyaml
  # --- test + docs + research/plots extras (dev convenience) ---
  - pytest=8.*
  - sphinx
  - ipython
  - minepy
  - requests
  - seaborn=0.13.*
  - upsetplot=0.9.*
  - matplotlib
  # --- lock tooling ---
  - conda-lock
  - mamba
  - pip
platforms:
  - linux-64
    # - win-64
